# Keeps the SHA-pinned actions current. Swift packages live in the Xcode project,
# which Dependabot cannot read; update JOSESwift in Xcode.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
