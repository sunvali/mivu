name: Release versions
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-versions
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Token-created PRs/tags do not automatically start other workflows.
      - name: Check the version pull requests
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          python3 -c '
          import json, os, subprocess
          prs = json.loads(os.environ["RELEASE_PRS"])
          allowed = {"release-please--branches--main--components--ios", "release-please--branches--main--components--android"}
          if not allowed.issuperset(pr["headBranchName"] for pr in prs):
              raise SystemExit("Unexpected release branch.")
          for pr in prs:
              target = ["--repo", os.environ["GH_REPO"], "--ref", pr["headBranchName"]]
              subprocess.run(["gh", "workflow", "run", "commit-title.yml", *target, "-f", "title=" + pr["title"]], check=True)
              subprocess.run(["gh", "workflow", "run", "ci.yml", *target], check=True)
          '
