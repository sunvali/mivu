name: Native release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag reachable from main (v1.0.0 or v1.0.0-rehearsal.1)
        required: true
        type: string
      signed_delivery:
        description: Export a signed IPA (requires owner Apple credentials)
        default: false
        type: boolean
      upload_testflight:
        description: Upload signed build for internal TestFlight processing
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: native-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  artifacts:
    if: vars.MIVU_ACTIONS_ALLOWANCE_VERIFIED == 'true'
    runs-on: macos-26
    timeout-minutes: 35
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind release to a versioned main commit
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          REQUEST_SIGNED: ${{ inputs.signed_delivery || inputs.upload_testflight || false }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "$REQUEST_SIGNED" = true ] && [ "$WORKFLOW_REF" != refs/heads/main ]; then
            echo 'Signed delivery must be dispatched from main.' >&2; exit 1
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rehearsal\.[0-9]+)?$ ]] || { echo 'Invalid release version tag.' >&2; exit 1; }
          sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/main || { echo 'Release source must be merged into main.' >&2; exit 1; }
          git checkout --detach "$sha"
          printf 'sha=%s\ntag=%s\n' "$sha" "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Check result verifier
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Test and build exact release source
        run: bash scripts/ci/native.sh release
      - name: Build unsigned device archive
        run: bash scripts/ci/native.sh unsigned
      - name: Preserve release products and test evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-${{ steps.source.outputs.sha || github.sha }}
          path: |
            build/ci/Mivu.xcresult
            build/ci/*.json
            build/ci/*.txt
            build/ci/*.zip
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-${{ needs.artifacts.outputs.sha }}
          path: products
      - name: Create private draft release with honest artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.artifacts.outputs.tag }}
          SOURCE_SHA: ${{ needs.artifacts.outputs.sha }}
        run: |
          printf 'Source commit: %s\n\nSimulator application only. The device archive is unsigned and cannot be installed on a physical iPhone. Test counts and named cases are in test-report.txt. Signed IPA and TestFlight are separate credential-gated outcomes.\n' "$SOURCE_SHA" > release-notes.txt
          # Preserve release-please notes and never overwrite versioned assets.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" products/*.zip products/*-provenance.json products/test-report.txt
          else
            gh release create "$RELEASE_TAG" --verify-tag --target "$SOURCE_SHA" --draft --title "Mivu $RELEASE_TAG" --notes-file release-notes.txt products/*.zip products/*-provenance.json products/test-report.txt
          fi
  signed:
    needs: artifacts
    if: github.event_name == 'workflow_dispatch' && (inputs.signed_delivery || inputs.upload_testflight) && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.artifacts.outputs.sha }}
          persist-credentials: false
      - name: Export signed IPA and optionally upload to TestFlight
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          UPLOAD_TESTFLIGHT: ${{ inputs.upload_testflight }}
        run: bash scripts/ci/signed.sh
      - name: Preserve signed IPA
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: signed-${{ needs.artifacts.outputs.sha }}
          path: |
            build/signed/ipa/*.ipa
            build/signed/provenance.json
          retention-days: 1
          if-no-files-found: error
